<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Address Search</title>
</head>
<body>
    <form action="/" method="POST">
        <label for="address-input">Address: </label>
        <input type="text" name="address-input" id="">
        <input type="submit" value="send-address">

    </form>
    <div class="address-info">
        {% if contact_blocks %}
            {% for contact_block in contact_blocks %}
                <div class="card m-3 p-3" style="width: 25rem;">
                    <h4 class="card-title">Jurisdiction: {{ contact_block.juris_block.jurisdiction_name }}</h4>
                    {%for permit_type in contact_block.juris_block.permit_types %}
                    <p class="card-text">{{ permit_type }}   </p>
                    {% endfor %}
                    <p class="card-text">{{ contact_block.contact_info | safe }}</p>
                </div>                
            {% endfor %}
        {% endif %}
    </div>
</body>
</html>
